/* ===== FORM CARD ===== */
function FormCard({ onSubmit, compact }) {
  const [vals, setVals] = React.useState({ prenom: "", nom: "", email: "", cp: "" });
  const [consent, setConsent] = React.useState(false);
  const [errors, setErrors] = React.useState({});

  const set = (k) => (e) => {
    setVals((v) => ({ ...v, [k]: e.target.value }));
    if (errors[k]) setErrors((er) => ({ ...er, [k]: false }));
  };

  const validate = () => {
    const er = {};
    if (!vals.prenom.trim()) er.prenom = true;
    if (!vals.nom.trim()) er.nom = true;
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(vals.email)) er.email = true;
    if (!/^\d{5}$/.test(vals.cp.trim())) er.cp = true;
    if (!consent) er.consent = true;
    setErrors(er);
    return Object.keys(er).length === 0;
  };

  const submit = (e) => {
    e.preventDefault();
    if (validate()) onSubmit({ ...vals });
  };

  const uid = compact ? "b" : "a";

  return (
    <form className="form-card" onSubmit={submit} noValidate>
      <div className="form-head">
        <div className="pill pill-green" style={{ marginBottom: 12 }}>
          <Icon name="gift" size={14} /> Ebook offert
        </div>
        <h3 className="h3">{TONE.formTitle}</h3>
        <p>{TONE.formSub}</p>
      </div>

      <div className="field-row">
        <div className={"field" + (errors.prenom ? " error" : "")}>
          <label>Prénom <span className="req">*</span></label>
          <input value={vals.prenom} onChange={set("prenom")} placeholder="Camille" />
          <div className="err-msg">Indiquez votre prénom</div>
        </div>
        <div className={"field" + (errors.nom ? " error" : "")}>
          <label>Nom <span className="req">*</span></label>
          <input value={vals.nom} onChange={set("nom")} placeholder="Durand" />
          <div className="err-msg">Indiquez votre nom</div>
        </div>
      </div>

      <div className={"field" + (errors.email ? " error" : "")}>
        <label>Adresse e-mail <span className="req">*</span></label>
        <input type="email" value={vals.email} onChange={set("email")} placeholder="camille.durand@email.fr" />
        <div className="err-msg">Adresse e-mail invalide</div>
      </div>

      <div className={"field" + (errors.cp ? " error" : "")}>
        <label>Code postal <span className="req">*</span></label>
        <input inputMode="numeric" maxLength={5} value={vals.cp} onChange={set("cp")} placeholder="64200" />
        <div className="err-msg">5 chiffres attendus</div>
      </div>

      <div className={"consent" + (errors.consent ? " error" : "")}>
        <input type="checkbox" id={"consent-" + uid} checked={consent}
          onChange={(e) => { setConsent(e.target.checked); if (errors.consent) setErrors((er) => ({ ...er, consent: false })); }} />
        <label htmlFor={"consent-" + uid}>
          J'accepte de recevoir le Guide Engagé et la newsletter de Surfrider Foundation.
          Mes données sont traitées conformément à la <a href="#" onClick={(e) => e.preventDefault()}>politique de confidentialité</a>.
        </label>
      </div>

      <button className="btn btn-blue full lg" type="submit">
        {TONE.cta} <Icon name="arrow" size={18} />
      </button>

      <div className="form-foot-note">
        <Icon name="shield" size={14} /> Sans engagement · Désinscription en 1 clic
      </div>
    </form>
  );
}

/* ===== FORM MODAL ===== */
function FormModal({ open, onClose, onSubmit }) {
  React.useEffect(() => {
    if (!open) return;
    const onKey = (e) => { if (e.key === "Escape") onClose(); };
    document.addEventListener("keydown", onKey);
    const prev = document.body.style.overflow;
    document.body.style.overflow = "hidden";
    return () => { document.removeEventListener("keydown", onKey); document.body.style.overflow = prev; };
  }, [open, onClose]);

  if (!open) return null;
  return (
    <div className="modal-overlay" onMouseDown={(e) => { if (e.target === e.currentTarget) onClose(); }}>
      <div className="modal-card" role="dialog" aria-modal="true" aria-label="Recevoir le Guide Engagé">
        <button className="modal-close" onClick={onClose} aria-label="Fermer"><Icon name="close" size={20} /></button>
        <FormCard onSubmit={onSubmit} />
      </div>
    </div>
  );
}

/* ===== CONFIRMATION ===== */

  return (
    <section className="confirm-wrap">
      <div className="wrap confirm-card">
        <div className="confirm-check"><Icon name="check" size={46} stroke={3} /></div>
        <h1>Merci {data.prenom} !<br/>Votre guide est en route</h1>
        <p>
          Nous venons d'envoyer « L'évasion qui a du sens » à <span className="email-hl">{data.email}</span>.
          Vérifiez votre boîte de réception (et vos spams) : votre évasion responsable commence maintenant.
        </p>
        <div className="confirm-actions">
          <a className="btn btn-blue lg" href="#" onClick={(e) => e.preventDefault()}>
            <Icon name="arrowDown" size={18} /> Télécharger le guide (PDF)
          </a>
          <a className="btn btn-outline lg" href="#" onClick={(e) => { e.preventDefault(); onReset(); }}>
            Revenir à la page
          </a>
        </div>
        <div className="confirm-next">
          <p style={{ marginTop: 0 }}>Envie d'aller plus loin pour protéger l'Océan ?</p>
          <a className="btn btn-orange lg" href="#" onClick={(e) => e.preventDefault()}>
            <Icon name="heart" size={18} /> Je soutiens Surfrider
          </a>
        </div>
      </div>
    </section>
  );
}

/* ===== APP ===== */
function App() {
  const [submitted, setSubmitted] = React.useState(null);
  const [modalOpen, setModalOpen] = React.useState(false);

  const openForm = () => setModalOpen(true);
  const handleSubmit = (data) => {
    setModalOpen(false);
    setSubmitted(data);
    window.scrollTo({ top: 0, behavior: "smooth" });
  };

  return (
    <div>
      <Header onOpenForm={openForm} />

      {submitted ? (
        <Confirmation data={submitted} onReset={() => setSubmitted(null)} />
      ) : (
        <main>
          <Hero onOpenForm={openForm} />
          <Reassure />
          <Features />
          <Destinations onOpenForm={openForm} />
          <Testimonial />
          <FormSection onSubmit={handleSubmit} />
          <DonBand />
        </main>
      )}

      <Footer />

      <FormModal open={modalOpen} onClose={() => setModalOpen(false)} onSubmit={handleSubmit} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
